<!DOCTYPE html>
<html
	lang="en"
	theme="pink">
	<head>
		<meta charset="UTF-8" />
		<script>
			try {
				const savedTheme = localStorage.getItem("theme");
				const validThemes = ["pink", "red", "blue", "green"];
				if (savedTheme && validThemes.includes(savedTheme)) {
					document.documentElement.setAttribute("theme", savedTheme);
				}
			} catch (e) {
				// Access to localStorage may be denied
			}
		</script>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<meta
			name="theme-color"
			content="var(--background-color)" />
		<link
			rel="icon"
			type="image/svg+xml"
			href="./logo.svg" />
		<title>Ryan Dawes</title>
		<meta
			property="og:url"
			content="https://dawes.cc" />
		<meta
			property="og:type"
			content="website" />
		<meta
			property="og:title"
			content="Ryan Dawes" />
		<meta
			property="og:description"
			content="Application Developer" />
		<meta
			property="og:image"
			content="./og.png" />
	</head>
	<body>
		<div id="root"></div>
		<script
			type="module"
			src="./frontend.tsx"></script>
		<script
			type="module"
			src="./index.js"></script>
	</body>
</html>
